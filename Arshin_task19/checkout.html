<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .inner-cointainer {
            text-align: center;
            margin-bottom: 20px;
        }

        .inner-cointainer h2 {
            font-size: 100px;
            color: #28a745;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to Checkout!</h1>

        <p id="first-para">Your laundry booking is confirmed.</p>
        <div class="inner-cointainer">
            <h2><i class="fa-solid fa-circle-check"></i></h2>
        </div>
        <p id="second-para">Thank you for choosing our services.</p>
        <p id="third-para">Click anywhere to return to the homepage.</p>
    </div>
<script>
    const body = document.querySelector('body');
    body.onclick = function () {
        window.location.href = "index.html";
    }
</script>
</body>

</html>
