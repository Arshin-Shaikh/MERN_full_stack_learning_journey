<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - filter and mapping</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>Student Records</h1>
            <button class="btn">Log In</button>
        </div>
    </header>
    <main>
        <div class="main_container">
            <p>Search and view student details ....</p>
            <section class="search-sec">
                <input type="text" id="searchInput" placeholder="Search Student" aria-label="Search student by name">
                <button id="searchButton"><i class="fa-solid fa-magnifying-glass"></i></button>
            </section>
            <section id="studentContainer" class="student-container" aria-live="polite"></section>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
