<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS LAUNDRY MART LOGIN PAGE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <section class="log-in">
        <div class="left">
            <img src="https://images.unsplash.com/photo-1655041448985-f6666cba2d6c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGxhdW5kcnl8ZW58MHx8MHx8fDA%3D"
                alt="Laundry Mart ">
        </div>
        <div class="right">
            <form class="form">
                <div class="heading">
                    <h1>HELLO AGAIN!</h1>
                    <h6><i>Welcome back you've been missed!</i></h6>
                </div>

                <div class="input-section">
                    <label for="email">Username</label>
                    <input type="email" id="email" placeholder="emailid@site.com" required>
                </div>

                <div class="pass">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>

                <button type="submit" id="log-btn">Log In</button>
                <label for="register" id="register">Don't have an account? <a href="#">Register now</a></label>
            </form>
        </div>
        </div>
    </section>
</body>

</html>
