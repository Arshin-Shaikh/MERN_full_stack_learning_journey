<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Javascript - DOM</title>
</head>

<body>
    <section class="header">
        <header id="greetings">
            <p>Hello User...</p>
        </header>
    </section>
    <section class="main">
        <div class="container">
            <div class="box" id="box-1">Red</div>
            <div class="box" id="box-2">Blue</div>
            <div class="box" id="box-3">Yellow</div>
            <div class="box" id="box-4">Green</div>
        </div>
        <div class="input-user">
            <input type="text" name="name" id="name" placeholder="usersname" />
            <button type="submit" id="btn">Submit</button>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
